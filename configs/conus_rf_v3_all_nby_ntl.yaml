# Dasy_CONUS_RF_v3_all_nby_ntl (strata test; request docs/handoff/strata_request.md; docs/conus_plan.md "Strata
# (PLURAL area type x cell group)"): v5.7's era Y2010 (= Dasy_CONUS_RF_v3_all_nby: same split, folds, statuses, water
# mask, strips, search space and 60 candidates; no exclude_counties) + ntl (DMSP NTL, cutout layer NTL, as Dasy_CONUS_RF_v3_ntl).
# 2010 only (the PLURAL grid has 1940 / 1980 / 2010, NTL starts in 1992). Used as a within-stratum score by
# src/validation/strata.py (its cell people order the cells inside each county x area type x cell group; v5.7's people
# per stratum kept) and reported as a full version next to v5.7 / pq5 (compare_models.py). Checked against v5.7 by
# `strata.py config` (the era = v5.7's Y2010 + ntl, every other setting = v5.7's).
# Output: $HISDAC_SCRATCH/dasymetric/conus/Dasy_CONUS_RF_v3_all_nby_ntl/
version: Dasy_CONUS_RF_v3_all_nby_ntl

study_area: configs/conus_study_area.yaml
years: [2010]

water_mask: yearly
compare_with: Dasy_CONUS_RF_v3_all_nby

split: configs/conus_split.csv
use_status: [ok, filled_nhgis, filled_nhgis_alloc]
train_status: [ok, filled_nhgis]
unusable: skip
block_rows: 512

eras:
  Y2010:
    years: [2010]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby, ntl]

# elev and slope are separate groups, not one Terrain group (decided 2026-10-20).
feature_groups:
  Building: [bui, bldg_size, mu_ratio]
  Undated records: [nby]
  Settlement context: [dist_built]
  Land use: [res_share, rent_share]
  Elevation: [elev]
  Slope: [slope]
  Night lights: [ntl]

maps:
  years: [2010]
  compare_years: [2010]   # side by side with v5.7

correlation_threshold: 0.8

model: rf

search:
  n_iter: 60   # as v5.7
  random_state: 42
  cv_folds: 5
  scoring: neg_root_mean_squared_error

permutation: {n_repeats: 10, random_state: 42}

models:
  rf:        # sklearn.ensemble.RandomForestRegressor
    fixed: {random_state: 42}
    space:
      n_estimators: {dist: randint, low: 200, high: 1000}
      max_depth: [null, 5, 10, 15, 20, 30]
      min_samples_leaf: {dist: randint, low: 1, high: 10}
      max_features: [sqrt, 0.33, 0.5, 0.75, 1.0]
