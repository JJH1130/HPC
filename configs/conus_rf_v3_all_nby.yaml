# Dasy_CONUS_RF_v3_all_nby (v5.4 + NobuiltYear, no filter; request 2026-11-04, docs/handoff/v54_nby_request.md;
# docs/conus_plan.md "v5.4 + NobuiltYear (no filter)"): v5.4 (= Dasy_CONUS_RF_v3_all: same split, folds, statuses,
# water mask, strips, search space and 60 candidates; NO exclude_counties) + one cell feature, the same as the
# NobuiltYear feature test (Dasy_CONUS_RF_v3_u070_nby):
#   - nby: cell value = HISDAC NobuiltYear (cutout layer NOBUILT: records without a built year, ~2016), the same value
#     in every year; county value = mean over the unmasked cells as every other feature
# Question: if nby carries the record uncertainty as a feature, is the t070 county filter (1,020 counties out of
# search, fit and TEST) still needed? One change only: v5.4 + one feature; every era = v5.4's era of that year + nby.
# Years 1910 / 1940 / 1960 / 1980 / 2010 (as the NobuiltYear test). compare_with v5.4. No selection rule: compared
# with v5.4, v5.6 and v5.6 + nby by src/validation/v54_nby_compare.py on all TEST counties; the user decides; tracts
# not used for tuning. Chosen 2026-11-04 as v5.7, the next base version (best on all TEST counties every year;
# docs/conus_plan.md "Version summary"). All census years 1900-2020 added 2026-11-04 (request
# docs/handoff/v57_all_years_request.md; docs/conus_plan.md "v5.7 all years"): eras Y1900 / Y1920 / Y1930 / Y1950 /
# Y1970 / Y1990 / Y2000 / Y2020 = v5.4's era of that year + nby (1900-1930 without Land_Use, as v5.4; 2020 = NHGIS 2020
# on the 2010 polygons, as v5.4's Y2020), run with --years (sbatch/submit_conus.sh v57all); the five eras run before are
# unchanged (byte for byte in this file) and are not recomputed.
# Output: $HISDAC_SCRATCH/dasymetric/conus/Dasy_CONUS_RF_v3_all_nby/
version: Dasy_CONUS_RF_v3_all_nby

study_area: configs/conus_study_area.yaml
years: {start: 1900, stop: 2020, step: 10}

water_mask: yearly
compare_with: Dasy_CONUS_RF_v3_all

split: configs/conus_split.csv
use_status: [ok, filled_nhgis, filled_nhgis_alloc]
train_status: [ok, filled_nhgis]
unusable: skip
block_rows: 512

eras:
  # v5.4's era of the year + nby (res_share / rent_share need Land_Use, 1940+); Y1910 / Y1940 / Y1960 /
  # Y1980 / Y2010 as run 2026-11-04 (unchanged), the other eight added for all years.
  Y1900:
    years: [1900]
    features: [bui, bldg_size, mu_ratio, dist_built, elev, slope, nby]
  Y1910:
    years: [1910]
    features: [bui, bldg_size, mu_ratio, dist_built, elev, slope, nby]
  Y1920:
    years: [1920]
    features: [bui, bldg_size, mu_ratio, dist_built, elev, slope, nby]
  Y1930:
    years: [1930]
    features: [bui, bldg_size, mu_ratio, dist_built, elev, slope, nby]
  Y1940:
    years: [1940]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby]
  Y1950:
    years: [1950]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby]
  Y1960:
    years: [1960]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby]
  Y1970:
    years: [1970]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby]
  Y1980:
    years: [1980]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby]
  Y1990:
    years: [1990]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby]
  Y2000:
    years: [2000]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby]
  Y2010:
    years: [2010]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby]
  Y2020:
    years: [2020]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby]

# elev and slope are separate groups, not one Terrain group (decided 2026-10-20).
feature_groups:
  Building: [bui, bldg_size, mu_ratio]
  Undated records: [nby]
  Settlement context: [dist_built]
  Land use: [res_share, rent_share]
  Elevation: [elev]
  Slope: [slope]

maps:
  years: [2010]
  compare_years: [2010]   # side by side with v5.4

correlation_threshold: 0.8

model: rf

search:
  n_iter: 60   # as v5.4
  random_state: 42
  cv_folds: 5
  scoring: neg_root_mean_squared_error

permutation: {n_repeats: 10, random_state: 42}

models:
  rf:        # sklearn.ensemble.RandomForestRegressor
    fixed: {random_state: 42}
    space:
      n_estimators: {dist: randint, low: 200, high: 1000}
      max_depth: [null, 5, 10, 15, 20, 30]
      min_samples_leaf: {dist: randint, low: 1, high: 10}
      max_features: [sqrt, 0.33, 0.5, 0.75, 1.0]
