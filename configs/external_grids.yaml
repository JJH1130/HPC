# External gridded population products compared with CONUS v5.6 (= Dasy_CONUS_RF_v3_u070; v5.4 = Dasy_CONUS_RF_v3_all
# as a second column) on the same census tracts (docs/conus_plan.md "External comparison" and "External comparison with
# v5.6"; requests docs/handoff/external_grids_request.md, external_v56_request.md; data registered in
# docs/data_sources.md). Read by src/validation/external_compare.py (tracts) and external_city_maps.py (city maps);
# files downloaded by sbatch/external_download.sh.
#
# path: relative to --data-root ($DATA_ROOT/raw/external); {YEAR} = 4-digit year, {YY} = last 2 digits; a glob
#   (`*`, `**`) must match exactly one file or Esri GRID folder (matched without case if the exact glob finds none);
#   `exclude` drops matches whose name matches the regex.
# years: census years with US tracts (1910-2010) the product has.
# input_unit: the census unit the product used as input in the US, from the cited documents ("unverified" where the
#   official documents could not be read; finer than tracts = an advantage on a tract validation).
# input_unit_class: block = built from census units finer than tracts in the US (a reference line on a tract
#   validation, not a competitor; dashed in the figure) / county = county input like ours / unverified.
#
# reference: the version whose evaluated tracts (flag ok in tract_errors_{YEAR}.csv) are summed by `extract` and
# scored. compare_versions: further versions scored on the same tracts (their evaluated tracts must be the same set;
# v5.4's and v5.6's are, checked 2026-11-03). Both are county-input versions (input_unit_class county).
reference: Dasy_CONUS_RF_v3_u070
reference_label: "v5.6 (Dasy_CONUS_RF_v3_u070)"
compare_versions:
  Dasy_CONUS_RF_v3_all: "v5.4 (Dasy_CONUS_RF_v3_all)"

products:
  ghs_pop:
    label: GHS-POP R2023A (100 m)
    path: ghs_pop/GHS_POP_E{YEAR}_GLOBE_R2023A_54009_100_V1_0.tif
    years: [1980, 1990, 2000, 2010]
    input_unit: "GPWv4.11 census units (US: unverified, see gpw4); 1980 / 1990 = GPWv4.11 counts extrapolated back, not that year's census"
    input_unit_source: "https://data.europa.eu/89h/2ff68a52-5b5b-4a22-8f40-c41da8332cfe"
    input_unit_class: block
  worldpop:
    label: WorldPop (100 m, unconstrained)
    path: worldpop/usa_ppp_{YEAR}.tif
    years: [2000, 2010]
    input_unit: "subnational census-based counts (CIESIN / GPWv4 units); US level unverified"
    input_unit_source: "https://hub.worldpop.org/geodata/summary?id=4055"
    input_unit_class: block
  gpw4:
    label: GPW v4.11 (30 arc-sec)
    path: gpw4/{YEAR}/*population_count*{YEAR}_30_sec.tif
    years: [2000, 2010]
    input_unit: "unverified (2010-round census units; the USA row of the GPWv4.11 country summary is printed by the inventory)"
    input_unit_source: "https://data.earthdata.nasa.gov/nasa-earth/human-dimensions/sedac-root/downloads/docs-repo/gpw-v4-rev11-country-level-summary-general-documentation.xlsx"
    input_unit_class: block
  grump1:
    label: GRUMP v1 (30 arc-sec)
    path: grump1/{YEAR}/**/*.bil
    exclude: "ag\\.bil$"   # glup<yy>ag = UN-adjusted, if the zip holds both
    years: [1990, 2000]
    input_unit: "unverified (GPWv3 census units)"
    input_unit_source: "https://data.earthdata.nasa.gov/nasa-earth/human-dimensions/sedac-root/downloads/docs-repo/gpw-v3-documentation.pdf"
    input_unit_class: unverified
  fj_m3:
    label: Fang & Jawitz 2018 M3 (1 km)
    path: fang_jawitz/grids/**/pop_m3_{YEAR}
    years: [1910, 1920, 1930, 1940, 1950, 1970, 1980, 1990, 2000, 2010]
    input_unit: "county (NHGIS); 2000 tracts used for the low-population mask and calibration"
    input_unit_source: "https://doi.org/10.1038/sdata.2018.67"
    input_unit_class: county
  fj_m5:
    label: Fang & Jawitz 2018 M5 (1 km)
    path: fang_jawitz/grids/**/pop_m5_{YEAR}
    years: [1910, 1920, 1930, 1940, 1950, 1970, 1980, 1990, 2000, 2010]
    input_unit: "county (NHGIS); 2000 tracts used for the low-population mask and calibration"
    input_unit_source: "https://doi.org/10.1038/sdata.2018.67"
    input_unit_class: county

# City maps (src/validation/external_city_maps.py; Noi et al. draft, Figure 10): a box_km x box_km box around each
# city centre on our 250 m grid (ESRI:102039, the v5.6 prediction grid); v5.6 next to the products of that year, all
# moved to our cells with population kept (each product pixel split into sub-points of <= subpixel_m, each carrying
# its share of the pixel's people, binned into our cells). Agreement with v5.6, not accuracy.
city_maps:
  version: Dasy_CONUS_RF_v3_u070
  version_label: v5.6
  box_km: 40
  block_km: 1        # Spearman of log density on 1 km blocks (4 x 4 cells) inside our mask
  subpixel_m: 25
  years:
    1980: [ghs_pop, fj_m5]
    2010: [ghs_pop, fj_m5, worldpop]
  cities:   # centre lon / lat (city hall / downtown)
    denver:         {label: "Denver, CO",         lon: -104.9903, lat: 39.7392}
    salt_lake_city: {label: "Salt Lake City, UT", lon: -111.8910, lat: 40.7608}
    chicago:        {label: "Chicago, IL",        lon: -87.6298,  lat: 41.8781}
    boston:         {label: "Boston, MA",         lon: -71.0589,  lat: 42.3601}

# Meeting figures (src/validation/external_city_meeting.py; docs/handoff/city_maps_meeting_request.md +
# city_maps_meeting_fix_request.md): the boxes, move to our cells, mask and 1 km blocks of city_maps above; v5.6 next to
# the year's products (maps + 1 km block scatter plots), no F&J. Gap blocks of every city and year: v5.6 / <product> <
# ratio_max and <product> >= min_density people per km2 (fixed before the run), checked against HISDAC BUI / NobuiltYear.
city_meeting:
  years:
    2010: [ghs_pop, worldpop]
    1980: [ghs_pop]          # WorldPop starts in 2000
  cities: [boston, denver, chicago]
  labels: {ghs_pop: GHS-POP, worldpop: WorldPop}   # short names on the figures
  gap: {product: ghs_pop, ratio_max: 0.25, min_density: 1000}   # every city and year

# City boxes by density class (src/validation/external_city_density.py; request docs/handoff/v57_plural_density_request.md
# part B, Stefan 2026-11-17 item 4): the boxes, cells, mask and 1 km blocks of city_meeting above, split into classes by
# the block density of class_product in the same year (fixed before any result): rural < 100, peri_urban 100 - 1,000,
# urban >= 1,000 people per km2 (a block on a break goes to the upper class); the same breaks on our version's block
# density as a check (basis "version"). WorldPop uses the GHS-POP classes (same blocks). ratio_band: blocks with our /
# product > ratio_band (above) or < 1 / ratio_band (below) are counted.
city_density:
  class_product: ghs_pop
  breaks: [100, 1000]
  classes: [rural, peri_urban, urban]
  ratio_band: 4

# DEGURBA boxes (src/validation/degurba_boxes.py; request docs/handoff/rural_boxes_request.md, user decision 2026-11-21;
# docs/conus_plan.md "DEGURBA boxes"): classes and box choice by the EU / UN Degree of Urbanisation (stage I).
#   scheme A (main): GHS-SMOD R2023A of the year, each 250 m cell = the SMOD 1 km cell its centre falls in, a 1 km block
#     (4 x 4 cells) = the most frequent code of its 16 cells (a tie -> the higher = more urban code), then
#     urban = 30, peri_urban = 21-23 (urban cluster, not centre), rural = 11-13; water (10) / nodata -> class excluded.
#   scheme B (check): the same stage I rules on our version's 1 km block density (rules below), computed on the box +
#     margin_km on every side (clusters not cut at the box edge), then cut to the box.
# Boxes: the city boxes of city_maps / city_meeting (box_type city) + `boxes` below (box_type rural / peri_urban),
# chosen ONCE by `degurba_boxes.py select` with the rule below (fixed 2026-11-21 before any result) and written into
# `boxes`; later runs read them (select refuses to run again while `boxes` is filled).
rural_boxes:
  version: Dasy_CONUS_RF_v3_all_nby
  version_label: v5.7
  extra_versions: {Dasy_CONUS_RF_v3_all_nby_pq5: v5.7_pq5}
  years: {2010: [ghs_pop, worldpop], 1980: [ghs_pop]}
  cities: [boston, denver, chicago]
  box_km: 40
  smod:
    label: GHS-SMOD R2023A (1 km, DEGURBA stage I)
    path: ghs_smod/GHS_SMOD_E{YEAR}_GLOBE_R2023A_54009_1000_V2_0.tif
    years: [1980, 2010]
    select_year: 2010
    codes: {30: urban centre, 23: dense urban cluster, 22: semi-dense urban cluster, 21: suburban or peri-urban,
            13: rural cluster, 12: low density rural, 11: very low density rural, 10: water}
    scheme_a: {urban: [30], peri_urban: [21, 22, 23], rural: [11, 12, 13]}   # 10 / nodata -> excluded
  own_rules:          # scheme B on our 1 km blocks (people per km2 of the version, masked cells = 0 people)
    centre: {min_density: 1500, connectivity: 4, min_pop: 50000}
    cluster: {min_density: 300, connectivity: 8, min_pop: 5000}
    margin_km: 20
    hole_fill: four_sides   # a block whose 4 side neighbours all belong to one urban centre joins it (one pass);
                            # the manual's own gap rule could not be read 2026-11-21; edge smoothing left out
  select:
    counties: counties_2010.gpkg          # in $DATA_ROOT/processed/census_conus (our 2010 polygons)
    train_status: [ok, filled_nhgis]      # = train_status of configs/conus_rf_v3_all_nby.yaml
    # rural: no SMOD cell of 21-23 or 30 in the county; peri_urban: a 21-23 cell, no 30 cell; cell in county = centre
    # inside the polygon (SMOD grid); a county without any land cell (codes 11-30) is no candidate.
    # per region and type: the candidate with the median 2010 density (pop / area_km2; sorted by density, then
    # GISJOIN; an even count -> the lower middle); if refused, the next by |density - median| (a tie -> the lower
    # density, then GISJOIN). Refused: centre < min_dist_km from a city box or an earlier chosen box, or the box not
    # inside the union of all 2010 county polygons (= outside CONUS). Order: regions as listed, rural before peri_urban.
    # Box = box_km square around the polygon centroid (ESRI:102039) snapped to our 250 m grid (as the city boxes).
    min_dist_km: 50
    regions:   # Census regions by state FIPS
      Northeast: ["09", "23", "25", "33", "34", "36", "42", "44", "50"]
      Midwest: ["17", "18", "19", "20", "26", "27", "29", "31", "38", "39", "46", "55"]
      South: ["01", "05", "10", "11", "12", "13", "21", "22", "24", "28", "37", "40", "45", "47", "48", "51", "54"]
      West: ["04", "06", "08", "16", "30", "32", "35", "41", "49", "53", "56"]
  boxes: {}   # filled by degurba_boxes.py select (do not edit by hand); this key must stay the last of the file
