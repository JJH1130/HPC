# Dasy_CONUS_RF_v3_all_nbya (v5.7 with nby_age instead of nby; Stefan 2026-11-17 item 1, request 2026-11-18,
# docs/handoff/v57_nbya_request.md; docs/conus_plan.md "v5.7 with nby_age instead of nby"): v5.7
# (= Dasy_CONUS_RF_v3_all_nby: same split, folds, statuses, water mask, strips, search space and 60 candidates; NO
# exclude_counties) with ONE change: in every era the feature nby is replaced by nby_age, the year-scaled NobuiltYear
# of the NobuiltYear feature test (Dasy_CONUS_RF_v3_u070_nbya, same `nby_age:` block):
#   - nby_age: cell value = NobuiltYear x f_c(year), f_c = sum BUPR_year (cutout) / sum BUPR_2015 (raw HISDAC, the
#     uncertainty filter's 2010-county sums in county_record_uncertainty.csv) over the cell's 2010 county, clipped to
#     0-1, f_c = 1 where BUPR_2015 = 0 (Stefan: scale the undated records to the year by the county's growth of dated
#     records). f_c per county-year -> <era>/features/nby_age_factor.csv, checked again in predict; the factors must
#     equal the ones of Dasy_CONUS_RF_v3_u070_nbya (src/validation/v57_nbya_compare.py factors, before train).
# Years 1910 / 1940 / 1960 / 1980 / 2010 (as the NobuiltYear test). compare_with v5.7. Selection by county CV RMSE only
# (same CV county set as v5.7); the user decides; tracts reported, not used for tuning.
# Output: $HISDAC_SCRATCH/dasymetric/conus/Dasy_CONUS_RF_v3_all_nbya/
version: Dasy_CONUS_RF_v3_all_nbya

study_area: configs/conus_study_area.yaml
years: [1910, 1940, 1960, 1980, 2010]

water_mask: yearly
compare_with: Dasy_CONUS_RF_v3_all_nby

split: configs/conus_split.csv
use_status: [ok, filled_nhgis, filled_nhgis_alloc]
train_status: [ok, filled_nhgis]
unusable: skip
block_rows: 512

nby_age:
  bupr_ref: results/hisdac_uncertainty/county_record_uncertainty.csv   # GISJOIN, bupr_2015 (record_uncertainty.py)

eras:
  # v5.7's era of the year with nby -> nby_age (same position in the list)
  Y1910:
    years: [1910]
    features: [bui, bldg_size, mu_ratio, dist_built, elev, slope, nby_age]
  Y1940:
    years: [1940]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby_age]
  Y1960:
    years: [1960]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby_age]
  Y1980:
    years: [1980]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby_age]
  Y2010:
    years: [2010]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby_age]

# elev and slope are separate groups, not one Terrain group (decided 2026-10-20).
feature_groups:
  Building: [bui, bldg_size, mu_ratio]
  Undated records: [nby_age]
  Settlement context: [dist_built]
  Land use: [res_share, rent_share]
  Elevation: [elev]
  Slope: [slope]

maps:
  years: [2010]
  compare_years: [2010]   # side by side with v5.7

correlation_threshold: 0.8

model: rf

search:
  n_iter: 60   # as v5.7
  random_state: 42
  cv_folds: 5
  scoring: neg_root_mean_squared_error

permutation: {n_repeats: 10, random_state: 42}

models:
  rf:        # sklearn.ensemble.RandomForestRegressor
    fixed: {random_state: 42}
    space:
      n_estimators: {dist: randint, low: 200, high: 1000}
      max_depth: [null, 5, 10, 15, 20, 30]
      min_samples_leaf: {dist: randint, low: 1, high: 10}
      max_features: [sqrt, 0.33, 0.5, 0.75, 1.0]
