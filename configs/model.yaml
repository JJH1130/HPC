# Dasymetric model settings (src/dasymetric/; design: docs/dasymetric_v1.md, changes in docs/dasymetric_v2.md,
# docs/dasymetric_v3.md and docs/dasymetric_v3_1.md).
# Output: <--out-root>/<study name>/<version>/ — on Alpine $HISDAC_SCRATCH/dasymetric/massachusetts/v3_1/
# (one model per era under v3_1/<era>/; predictions, QA and maps for all years under v3_1/).
# Earlier settings are in git history: v1 = commit 8d93125, v2 = commit 38ed1e2, v3 = commit 8e6c35e
# (v2: one pooled model, features [bui, bldg_size, mu_ratio, age, dist_built, year];
#  v3: these eras and features, compare_with v2, no water_correction).
version: v3_1

# Water mask (docs/dasymetric_v3_1.md), per year: a cell is masked if it is all permanent water and has no
# building that year (water_frac == 1 and BUI == 0; layers/water_frac/water_frac.tif from src/grid/water_frac.py).
# Masked cells get weight 0; county features are means over the unmasked cells and area_km2 = 0.0625 x unmasked
# cells (y = log(pop / area_km2)). Partly-water cells, dry unbuilt cells and features are not changed; water is
# not a feature. false/absent = v1-v3 behaviour (all cells, polygon area).
water_mask: true

# Earlier version under the same out-root to compare with (read only; null = no comparison). A version with
# the same eras (v3): its saved out-of-fold predictions are read per era (no refit) and each version is scored
# on its own target. A pooled version (v2): refit with its features + best params on the same folds and scored
# on each era's rows. predict.py draws side-by-side maps for maps.compare_years.
compare_with: v3

# Reuse this version's GISJOIN -> fold mapping (<version>/model/folds.csv), filtered to each era's counties,
# so the comparison runs on identical folds (null = new GroupKFold folds per era). v3 used the same table.
folds_from: v2

# Study name and years come from here; inputs are that study's cutout (docs/cutout.md).
study_area: configs/study_area.yaml

# `status` values (zones_{YEAR}.csv) of the counties used for training AND reallocation.
# Cells of other counties are NoData in the predictions.
use_status: [ok, manual_fill]

# Eras (docs/dasymetric_v3.md, "Eras"): one model per era, trained on that era's county-years pooled;
# each census year is predicted with its own era's model. `years` is intersected with the study years
# ({start, stop} or a list); every study year must be in exactly one era. Instead of `eras`, a single
# top-level `features:` list gives one pooled model (v1, v2).
# Cell features are defined in src/dasymetric/common.py; county feature = mean over the county's cells.
# Known: bui, bupl, bupr, bua, bldg_size, mu_ratio, age, dist_built, year, res_share, rent_share, ntl.
# res_share/rent_share need the Land_Use layers (1940+), ntl the NTL layer (2000, 2010, 2020).
eras:
  E1:
    years: {start: 1810, stop: 1930}
    features: [bui, bldg_size, mu_ratio, dist_built, year]
  E2:
    years: {start: 1940, stop: 1990}
    features: [bui, bldg_size, mu_ratio, dist_built, year, res_share, rent_share]
  E3:
    years: {start: 2000, stop: 2020}
    features: [bui, bldg_size, mu_ratio, dist_built, year, res_share, rent_share, ntl]

# Concept groups for grouped SHAP: every used feature in exactly one group (per era, only its features).
feature_groups:
  Building: [bui, bldg_size, mu_ratio]
  Settlement context: [dist_built]
  Land use: [res_share, rent_share]
  Lights: [ntl]
  Period: [year]

# Quick-look maps (predict.py): years drawn alone, and years drawn side by side with compare_with.
maps:
  years: [1810, 1950, 2020]
  compare_years: [2020]

# Collinearity check before training: Spearman rho of county features; pairs above this |rho| are
# logged (nothing is dropped automatically).
correlation_threshold: 0.8

# Which entry under models: to train. Switching models is a config change only.
model: rf

# Hyperparameter search: RandomizedSearchCV over the model's space, GroupKFold with groups = GISJOIN
# (all years of a county stay in one fold). The best parameters are refit on all training rows.
search:
  n_iter: 20
  random_state: 42
  cv_folds: 5
  scoring: neg_root_mean_squared_error   # on y = log(pop / area_km2)

# Permutation importance of the refit model on the training rows (secondary to SHAP since v2).
permutation: {n_repeats: 10, random_state: 42}

# One entry per model: `fixed` = constructor arguments, `space` = candidates for the search.
# null = Python None.
models:
  rf:          # sklearn.ensemble.RandomForestRegressor
    fixed: {random_state: 42}
    space:
      n_estimators: [200, 300, 500, 800, 1000]
      max_depth: [null, 5, 10, 15, 20]
      min_samples_leaf: [1, 2, 4, 8]
      max_features: [sqrt, 0.33, 0.5, 1.0]
  # Placeholders: not implemented in v1 (train.py stops with a message). Fill `space` when added;
  # xgboost and catboost must first be added to envs/hisdac/environment.yml.
  lgbm:        # lightgbm.LGBMRegressor
    fixed: {random_state: 42}
    space: {}
  xgb:         # xgboost.XGBRegressor
    fixed: {random_state: 42}
    space: {}
  catboost:    # catboost.CatBoostRegressor
    fixed: {random_seed: 42}
    space: {}
