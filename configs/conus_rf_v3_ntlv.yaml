# Dasy_CONUS_RF_v3_ntlv (docs/conus_plan.md "VIIRS-like NTL test"; request 2026-10-28,
# docs/handoff/conus_ntl_viirs_request.md): the DMSP ntl of Dasy_CONUS_RF_v3_ntl halved the tract error in BUI gap
# counties but raised it elsewhere (glow on empty land). Same test with the less blooming VIIRS-like NTL (Chen et al.
# 2021, layer NTLV): = configs/conus_rf_v3_ntl.yaml with ntlv instead of ntl, nothing else changed (same model,
# search space, 60 candidates, split, folds, statuses, water mask, strips); compare_with v3_all (same folds).
# Output: $HISDAC_SCRATCH/dasymetric/conus/Dasy_CONUS_RF_v3_ntlv/
version: Dasy_CONUS_RF_v3_ntlv

study_area: configs/conus_study_area.yaml
years: [2000, 2010]

water_mask: yearly
compare_with: Dasy_CONUS_RF_v3_all

split: configs/conus_split.csv
use_status: [ok, filled_nhgis, filled_nhgis_alloc]
train_status: [ok, filled_nhgis]
unusable: skip
block_rows: 512

eras:
  # ntlv = VIIRS-like radiance (nW/cm2/sr) of the cell (cutout layers/NTLV, nearest from 15 arc-sec; county = mean).
  Y2000:
    years: [2000]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, ntlv]
  Y2010:
    years: [2010]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, ntlv]

feature_groups:
  Building: [bui, bldg_size, mu_ratio]
  Settlement context: [dist_built]
  Land use: [res_share, rent_share]
  Elevation: [elev]
  Slope: [slope]
  Night lights: [ntlv]

maps:
  years: [2000, 2010]
  compare_years: [2010]   # side by side with v3_all

correlation_threshold: 0.8

model: rf

search:
  n_iter: 60   # as v3_all
  random_state: 42
  cv_folds: 5
  scoring: neg_root_mean_squared_error

permutation: {n_repeats: 10, random_state: 42}

models:
  rf:        # sklearn.ensemble.RandomForestRegressor
    fixed: {random_state: 42}
    space:
      n_estimators: {dist: randint, low: 200, high: 1000}
      max_depth: [null, 5, 10, 15, 20, 30]
      min_samples_leaf: {dist: randint, low: 1, high: 10}
      max_features: [sqrt, 0.33, 0.5, 0.75, 1.0]
