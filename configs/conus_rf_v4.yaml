# Dasy_CONUS_RF_v4 (docs/conus_plan.md, "v3 and v4"): Dasy_CONUS_RF_v1 + the five PLURAL-1 distances (v2) + terrain
# (v3): every candidate feature. 1960 and 2010 only; same split, folds and test counties; compared with v1.
# Output: $HISDAC_SCRATCH/dasymetric/conus/Dasy_CONUS_RF_v4/
version: Dasy_CONUS_RF_v4

study_area: configs/conus_study_area.yaml
years: [1960, 2010]

water_mask: yearly
compare_with: Dasy_CONUS_RF_v1

split: configs/conus_split.csv
use_status: [ok, filled_nhgis, filled_nhgis_alloc]
train_status: [ok, filled_nhgis]
unusable: skip
block_rows: 512

eras:
  Y1960:
    years: [1960]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, d_10k, d_20k, d_50k, d_100k, d_250k,
               elev, slope]
  Y2010:
    years: [2010]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, d_10k, d_20k, d_50k, d_100k, d_250k,
               elev, slope]

feature_groups:
  Building: [bui, bldg_size, mu_ratio]
  Settlement context: [dist_built]
  Place distance: [d_10k, d_20k, d_50k, d_100k, d_250k]
  Land use: [res_share, rent_share]
  Elevation: [elev]
  Slope: [slope]

maps:
  years: [1960, 2010]
  compare_years: [2010]

correlation_threshold: 0.8

model: rf

search:
  n_iter: 20
  random_state: 42
  cv_folds: 5
  scoring: neg_root_mean_squared_error

permutation: {n_repeats: 10, random_state: 42}

models:
  rf:
    fixed: {random_state: 42}
    space:
      n_estimators: [200, 300, 500, 800, 1000]
      max_depth: [null, 5, 10, 15, 20]
      min_samples_leaf: [1, 2, 4, 8]
      max_features: [sqrt, 0.33, 0.5, 1.0]
