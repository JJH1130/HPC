# Dasy_CONUS_RF_v3_u070_nbya (NobuiltYear feature test; request 2026-11-04, docs/handoff/nobuiltyear_feature_request.md;
# docs/conus_plan.md "NobuiltYear feature test"): v5.6 (= Dasy_CONUS_RF_v3_u070: same split, folds, excluded counties
# t070, statuses, water mask, strips, search space and 60 candidates; every era = v5.6's era of that year) + one cell
# feature, county value = mean over the unmasked cells as every other feature:
#   - nby_age: cell value = NobuiltYear x f_c(year), f_c = sum BUPR_year (cutout) / sum BUPR_2015 (raw HISDAC, the
#     uncertainty filter's 2010-county sums in county_record_uncertainty.csv) over the cell's 2010 county, clipped to
#     0-1, f_c = 1 where BUPR_2015 = 0. Assumption: a county's undated records have the age distribution of its dated
#     ones (as the filter's ratio). f_c per county-year -> <era>/features/nby_age_factor.csv, checked again in predict.
# Years 1910 / 1940 / 1960 / 1980 / 2010 (user 2026-11-04: early years included, where undated records matter most;
# 1910 = v5.6's era without Land_Use, its tract check has 10 counties only, for reference). compare_with v5.6. No
# selection rule: both variants are reported (src/validation/nobuilt_compare.py), the user decides; tracts not used
# for tuning.
# Output: $HISDAC_SCRATCH/dasymetric/conus/Dasy_CONUS_RF_v3_u070_nbya/
version: Dasy_CONUS_RF_v3_u070_nbya

study_area: configs/conus_study_area.yaml
years: [1910, 1940, 1960, 1980, 2010]

water_mask: yearly
compare_with: Dasy_CONUS_RF_v3_u070

split: configs/conus_split.csv
exclude_counties: results/hisdac_uncertainty/excluded_counties_t070.csv
use_status: [ok, filled_nhgis, filled_nhgis_alloc]
train_status: [ok, filled_nhgis]
unusable: skip
block_rows: 512

nby_age:
  bupr_ref: results/hisdac_uncertainty/county_record_uncertainty.csv   # GISJOIN, bupr_2015 (record_uncertainty.py)

eras:
  Y1910:
    years: [1910]
    features: [bui, bldg_size, mu_ratio, dist_built, elev, slope, nby_age]
  Y1940:
    years: [1940]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby_age]
  Y1960:
    years: [1960]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby_age]
  Y1980:
    years: [1980]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby_age]
  Y2010:
    years: [2010]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby_age]

feature_groups:
  Building: [bui, bldg_size, mu_ratio]
  Undated records: [nby_age]
  Settlement context: [dist_built]
  Land use: [res_share, rent_share]
  Elevation: [elev]
  Slope: [slope]

maps:
  years: [2010]
  compare_years: [2010]   # side by side with v5.6

correlation_threshold: 0.8

model: rf

search:
  n_iter: 60   # as v5.6
  random_state: 42
  cv_folds: 5
  scoring: neg_root_mean_squared_error

permutation: {n_repeats: 10, random_state: 42}

models:
  rf:        # sklearn.ensemble.RandomForestRegressor
    fixed: {random_state: 42}
    space:
      n_estimators: {dist: randint, low: 200, high: 1000}
      max_depth: [null, 5, 10, 15, 20, 30]
      min_samples_leaf: {dist: randint, low: 1, high: 10}
      max_features: [sqrt, 0.33, 0.5, 0.75, 1.0]