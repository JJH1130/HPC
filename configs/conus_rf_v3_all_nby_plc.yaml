# Dasy_CONUS_RF_v3_all_nby_plc (PLURAL on v5.7; Stefan 2026-11-17 item 2, request 2026-11-19,
# docs/handoff/v57_plural_density_request.md; docs/conus_plan.md "PLURAL on v5.7"): v5.7 (= Dasy_CONUS_RF_v3_all_nby:
# same split, folds, statuses, water mask, strips, search space and 60 candidates; NO exclude_counties) + one feature,
# plural = Siqiao's 900 m PLURAL grid ("index3", 0 = urban ... 1 = remote) on the 250 m HISDAC grid: continuous, bilinear (the main resampling).
# The plural block is the one of conus_rf_v3_u070_plc.yaml (the PLURAL grid test on v5.6); every era = v5.7's era of
# that year + plural (checked by src/validation/v57_plural_compare.py config).
# Cell feature = the value; county feature = mean over the unmasked cells (as every other feature).
# Years 1940 / 1980 / 2010 (the grid's years); compare_with v5.7. Selection by county CV RMSE only (v5.7's CV county
# set); the user decides; tracts reported, not used for the choice.
# Output: $HISDAC_SCRATCH/dasymetric/conus/Dasy_CONUS_RF_v3_all_nby_plc/
version: Dasy_CONUS_RF_v3_all_nby_plc

study_area: configs/conus_study_area.yaml
years: [1940, 1980, 2010]

water_mask: yearly
compare_with: Dasy_CONUS_RF_v3_all_nby

split: configs/conus_split.csv
use_status: [ok, filled_nhgis, filled_nhgis_alloc]
train_status: [ok, filled_nhgis]
unusable: skip
block_rows: 512

plural:
  layer: PLURAL
  classes: null   # continuous: the cell value 0-1

eras:
  Y1940:
    years: [1940]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby, plural]
  Y1980:
    years: [1980]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby, plural]
  Y2010:
    years: [2010]
    features: [bui, bldg_size, mu_ratio, dist_built, res_share, rent_share, elev, slope, nby, plural]

# elev and slope are separate groups, not one Terrain group (decided 2026-10-20).
feature_groups:
  Building: [bui, bldg_size, mu_ratio]
  Undated records: [nby]
  Settlement context: [dist_built]
  Land use: [res_share, rent_share]
  Elevation: [elev]
  Slope: [slope]
  PLURAL: [plural]

maps:
  years: [2010]
  compare_years: [2010]   # side by side with v5.7

correlation_threshold: 0.8

model: rf

search:
  n_iter: 60   # as v5.7
  random_state: 42
  cv_folds: 5
  scoring: neg_root_mean_squared_error

permutation: {n_repeats: 10, random_state: 42}

models:
  rf:        # sklearn.ensemble.RandomForestRegressor
    fixed: {random_state: 42}
    space:
      n_estimators: {dist: randint, low: 200, high: 1000}
      max_depth: [null, 5, 10, 15, 20, 30]
      min_samples_leaf: {dist: randint, low: 1, high: 10}
      max_features: [sqrt, 0.33, 0.5, 0.75, 1.0]
